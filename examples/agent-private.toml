profile = "dev"
role = "agent"

[listen]
bind = "127.0.0.1:8080"

[auth]
require_local_auth = true
local_token_env = "DARIAL_LOCAL_TOKEN"

[gateway]
url = "http://127.0.0.1:8443"
auth_token_env = "DARIAL_GATEWAY_TOKEN"
privacy_profile = "private_buffered"

[relay]
url = "http://127.0.0.1:8444"

[dlp]
enabled = true
default_action = "block"
